// ─── CANVAS STATE ──────────────────────────────────────────────────────────

function rgba(hex,a){
  const h=hex.replace('#','');
  return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`;
}

function resize(){
  const m=document.getElementById('mainArea');
  W=m.clientWidth;H=m.clientHeight;canvas.width=W;canvas.height=H;
  cx=W/2;cy=H/2;const d=Math.min(W,H);
  R0=d*0.088;
  R1=d*0.170;R1b=d*0.275;   // Ring 2: segments — slightly wider for label readability
  R2=d*0.292;R2b=d*0.418;   // Ring 3: F500 channel
  R3=d*0.435;R3b=d*0.528;   // Ring 4: defense/gov/startups
  draw();
}

// ─── RING 2: NORTH-UP TEXT (always upright, reads outward from center) ─────
// Text is positioned at the arc midpoint but never rotated — always readable
function drawNorthUpText(lines, midR, angle, font, color, lineH) {
  if (!lines.length) return;
  ctx.save();
  // Position at arc midpoint
  const px = cx + midR * Math.cos(angle);
  const py = cy + midR * Math.sin(angle);
  ctx.font = font;
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  // No rotation — text stays perfectly upright (north-up)
  const totalH = (lines.length - 1) * lineH;
  lines.forEach((l, i) => {
    ctx.fillText(l, px, py - totalH / 2 + i * lineH);
  });
  ctx.restore();
}

// ─── RINGS 3 & 4: RADIAL TEXT (rotates with arc, flips so always readable) ─
function drawRadialText(lines, midR, angle, font, color, lineH) {
  if (!lines.length) return;
  ctx.save();
  ctx.font = font;
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const px = cx + midR * Math.cos(angle);
  const py = cy + midR * Math.sin(angle);
  ctx.translate(px, py);
  const na = ((angle % (2 * Math.PI)) + (2 * Math.PI)) % (2 * Math.PI);
  const flip = na > Math.PI / 2 && na < 3 * Math.PI / 2;
  ctx.rotate(flip ? angle + Math.PI : angle);
  const totalH = (lines.length - 1) * lineH;
  lines.forEach((l, i) => ctx.fillText(l, 0, -totalH / 2 + i * lineH));
  ctx.restore();
}

function wrap(text, maxW, font) {
  ctx.save(); ctx.font = font;
  const words = text.split(' '); const out = []; let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; }
    else line = t;
  }
  if (line) out.push(line);
  ctx.restore(); return out;
}

function chord(r, span) { return 2 * r * Math.sin(Math.min(span / 2, Math.PI / 2)) * 0.78; }

function arcShape(rIn, rOut, a0, a1, fill, stroke, lw, alpha) {
  ctx.save(); ctx.globalAlpha = alpha !== undefined ? alpha : 1;
  ctx.beginPath(); ctx.arc(cx, cy, rOut, a0, a1); ctx.arc(cx, cy, rIn, a1, a0, true); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 0.8; ctx.stroke(); }
  ctx.restore();
}

  [R1, R1b, R2, R2b, R3, R3b].forEach(r => {
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * Math.PI);
    ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 0.5; ctx.stroke();
  });

  SEGS.forEach((seg, si) => {
    const s0 = base + si * (segSpan + GAP);
    const s1 = s0 + segSpan, sm = s0 + segSpan / 2;
    const col = seg.color;
    const isSegHov = hovHit && hovHit.si === si && hovHit.type === 'segment';

    // ── Fill inner annulus so there is no dark gap outside center circle ──
    arcShape(R0, R1, s0, s1,
      rgba(col, isSegHov ? 0.20 : 0.11),
      rgba(col, 0.14),
      0.5
    );

    // ── Ring 2: Segment arc ──────────────────────────────────────────────
    arcShape(R1, R1b, s0, s1,
      rgba(col, isSegHov ? 0.52 : 0.30),
      rgba(col, isSegHov ? 1.0 : 0.65),
      isSegHov ? 1.8 : 0.9
    );

    // North-up label: always upright, positioned at arc midpoint
    const segMidR = (R1 + R1b) / 2;
    const sf = '700 9px Inter,sans-serif';
    const segLines = seg.label.split('\n');
    drawNorthUpText(segLines, segMidR, sm, sf, 'rgba(255,255,255,0.95)', 12.5);
    hits.push({ type: 'segment', si, a0: s0, a1: s1, rIn: R1, rOut: R1b, data: seg });

    // ── Ring 3: F500 / Channel ───────────────────────────────────────────
    const r3 = seg.r3, r3g = 0.005;
    const r3span = (segSpan - r3.length * r3g) / r3.length;
    const r3mid = (R2 + R2b) / 2;
    r3.forEach((item, ii) => {
      const a = s0 + ii * (r3span + r3g) + r3g / 2, b = a + r3span, m = a + r3span / 2;
      const pc = PC[item.priority];
      const isHov = hovHit && hovHit.type === 'ring3' && hovHit.si === si && hovHit.ii === ii;
      arcShape(R2, R2b, a, b, rgba(pc, isHov ? .30 : .12), rgba(pc, isHov ? .95 : .42), isHov ? 1.5 : .75);
      const f = `${isHov ? '600' : '400'} 7.5px Inter,sans-serif`;
      const lines = wrap(item.name, chord(r3mid, r3span) * 0.88, f);
      drawRadialText(lines, r3mid, m, f, isHov ? '#fff' : rgba(pc, 0.95), 10);
      hits.push({ type: 'ring3', si, ii, a0: a, a1: b, rIn: R2, rOut: R2b, data: item });
    });

    // ── Ring 4: Defense / Gov / Startups ────────────────────────────────
    const r4 = seg.r4, r4g = 0.005;
    const r4span = (segSpan - r4.length * r4g) / r4.length;
    const r4mid = (R3 + R3b) / 2;
    r4.forEach((item, ii) => {
      const a = s0 + ii * (r4span + r4g) + r4g / 2, b = a + r4span, m = a + r4span / 2;
      const pc = PC[item.priority];
      const isHov = hovHit && hovHit.type === 'ring4' && hovHit.si === si && hovHit.ii === ii;
      arcShape(R3, R3b, a, b, rgba(pc, isHov ? .22 : .07), rgba(pc, isHov ? .88 : .26), isHov ? 1.5 : .65);
      const nm = item.name.length > 17 ? item.name.slice(0, 15) + '…' : item.name;
      const f = `${isHov ? '600' : '400'} 7px Inter,sans-serif`;
      const lines = wrap(nm, chord(r4mid, r4span) * 0.85, f);
      drawRadialText(lines, r4mid, m, f, isHov ? '#fff' : rgba(pc, 0.85), 9.5);
      hits.push({ type: 'ring4', si, ii, a0: a, a1: b, rIn: R3, rOut: R3b, data: item });
    });
  });

  // ── Center circle ────────────────────────────────────────────────────────
  const gr = ctx.createRadialGradient(cx, cy, 0, cx, cy, R0);
  gr.addColorStop(0, '#1e2a4a'); gr.addColorStop(1, '#0e1522');
  ctx.beginPath(); ctx.arc(cx, cy, R0, 0, 2 * Math.PI); ctx.fillStyle = gr; ctx.fill();
  ctx.strokeStyle = 'rgba(74,144,217,0.40)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '700 11px Inter,sans-serif'; ctx.fillStyle = '#4a90d9'; ctx.fillText('Fortaegis', cx, cy - 11);
  ctx.font = '500 8.5px Inter,sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.50)'; ctx.fillText('U.S. Ecosystem', cx, cy + 1);
  ctx.font = '400 7.5px Inter,sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.fillText('SPU Secure Compute', cx, cy + 12);
  ctx.restore();
}

// ─── HIT TESTING ───────────────────────────────────────────────────────────
function ptAngle(x, y) { let a = Math.atan2(y - cy, x - cx); return ((a % (2 * Math.PI)) + (2 * Math.PI)) % (2 * Math.PI); }
function inArc(h, x, y) {
  const dx = x - cx, dy = y - cy, r = Math.sqrt(dx * dx + dy * dy);
  if (r < h.rIn || r > h.rOut) return false;
  let a = Math.atan2(dy, dx);
  const a0 = ((h.a0 % (2 * Math.PI)) + (2 * Math.PI)) % (2 * Math.PI);
  const a1 = ((h.a1 % (2 * Math.PI)) + (2 * Math.PI)) % (2 * Math.PI);
  a = ((a % (2 * Math.PI)) + (2 * Math.PI)) % (2 * Math.PI);
  if (a0 <= a1) return a >= a0 && a <= a1;
  return a >= a0 || a <= a1;
}
function hitTest(x, y) { for (let i = hits.length - 1; i >= 0; i--) { if (inArc(hits[i], x, y)) return hits[i]; } return null; }

// ─── TOOLTIP ───────────────────────────────────────────────────────────────
function showTip(h, ex, ey) {
  const d = h.data;
  document.getElementById('ttN').textContent = d.name || d.label;
  document.getElementById('ttR').textContent = d.role || 'Segment';
  document.getElementById('ttD').textContent = d.desc || (d.r3 && d.r4 ? `${d.r3.length} F500/Channel · ${d.r4.length} Defense/Gov/Startups` : '');
  const pe = document.getElementById('ttP');
  if (d.priority) { pe.textContent = d.priority; pe.className = 'tt-pri ' + d.priority; pe.style.display = ''; }
  else pe.style.display = 'none';
  const m = 16, tw = 270, th = 175;
  let tx = ex + m, ty = ey - th / 2;
  if (tx + tw > window.innerWidth) tx = ex - tw - m;
  if (ty < 4) ty = 4;
  if (ty + th > window.innerHeight - 4) ty = window.innerHeight - th - 4;
  tip.style.left = tx + 'px'; tip.style.top = ty + 'px'; tip.classList.add('vis');
}
function hideTip() { tip.classList.remove('vis'); }

// ─── DRAG / SPIN INTERACTION ───────────────────────────────────────────────
function angleFrom(x, y) { return Math.atan2(y - cy, x - cx); }

canvas.addEventListener('mousedown', e => {
  dragActive = true; dragStart = angleFrom(e.clientX, e.clientY);
  rotAtDrag = rotation; velocity = 0; lastAngle = dragStart; lastT = performance.now();
  canvas.classList.add('dragging'); if (animId) { cancelAnimationFrame(animId); animId = null; }
});
canvas.addEventListener('mousemove', e => {
  if (dragActive) {
    const a = angleFrom(e.clientX, e.clientY); const now = performance.now();
    velocity = (a - lastAngle) / (now - lastT || 1) * 16; lastAngle = a; lastT = now;
    rotation = rotAtDrag + (a - dragStart); hovHit = null; hideTip(); draw();
  } else {
    const h = hitTest(e.clientX, e.clientY);
    if (h !== hovHit) { hovHit = h; draw(); }
    if (h) showTip(h, e.clientX, e.clientY); else hideTip();
  }
});
canvas.addEventListener('mouseup', e => {
  if (!dragActive) return; dragActive = false; canvas.classList.remove('dragging');
  const a = angleFrom(e.clientX, e.clientY);
  if (Math.abs(a - dragStart) < 0.01) { const h = hitTest(e.clientX, e.clientY); if (h) { hovHit = h; draw(); showTip(h, e.clientX, e.clientY); } }
  else coast();
});
canvas.addEventListener('mouseleave', () => { dragActive = false; canvas.classList.remove('dragging'); hovHit = null; hideTip(); draw(); });
canvas.addEventListener('touchstart', e => { e.preventDefault(); const t = e.touches[0]; dragActive = true; dragStart = angleFrom(t.clientX, t.clientY); rotAtDrag = rotation; velocity = 0; lastAngle = dragStart; lastT = performance.now(); }, { passive: false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); if (!dragActive) return; const t = e.touches[0]; const a = angleFrom(t.clientX, t.clientY); const now = performance.now(); velocity = (a - lastAngle) / (now - lastT || 1) * 16; lastAngle = a; lastT = now; rotation = rotAtDrag + (a - dragStart); draw(); }, { passive: false });
canvas.addEventListener('touchend', e => { dragActive = false; if (Math.abs(velocity) > 0.005) coast(); });

function coast() {
  if (animId) cancelAnimationFrame(animId);
  function tick() { velocity *= 0.94; if (Math.abs(velocity) < 0.0003) { animId = null; return; } rotation += velocity; draw(); animId = requestAnimationFrame(tick); }
  animId = requestAnimationFrame(tick);
}

document.getElementById('rotL').addEventListener('click', () => { if (animId) { cancelAnimationFrame(animId); animId = null; } velocity = -0.04; coast(); });
document.getElementById('rotR').addEventListener('click', () => { if (animId) { cancelAnimationFrame(animId); animId = null; } velocity = 0.04; coast(); });
window.addEventListener('resize', resize);
resize();
</script>
